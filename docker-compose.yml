version: '3.9'

services:

  # ── Django + Gunicorn ───────────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/app/db/db.sqlite3
    volumes:
      - survey_data:/app/data
      - survey_media:/app/media
      - survey_db:/app/db
      - survey_static:/app/staticfiles
    expose:
      - "8000"

  # ── Nginx reverse proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - survey_media:/app/media:ro
      - survey_static:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  survey_data:
  survey_media:
  survey_db:
  survey_static:

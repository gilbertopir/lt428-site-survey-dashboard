services:

  # ── Django + Gunicorn ───────────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/app/db/db.sqlite3
    volumes:
      - "C:/Users/gdp/Python Projects/lt428-site-survey-dashboard/data:/app/data"
      - "C:/Users/gdp/Python Projects/lt428-site-survey-dashboard/media:/app/media"
      - "C:/Users/gdp/Python Projects/lt428-site-survey-dashboard/db.sqlite3:/app/db/db.sqlite3"
      - survey_static:/app/staticfiles
    expose:
      - "8000"

  # ── Nginx reverse proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8507:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - "C:/Users/gdp/Python Projects/lt428-site-survey-dashboard/media:/app/media:ro"
      - survey_static:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  survey_data:
  survey_media:
  survey_db:
  survey_static:
